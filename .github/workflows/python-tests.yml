name: Python tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Teeth regression tests
        env:
          APP_ENV: test
          FLASK_SECRET_KEY: ci-test-secret-key
          SPREADSHEET_ID: ci-test-spreadsheet
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s tests -p 'test_teeth_*.py' -v
