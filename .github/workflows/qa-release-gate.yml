name: QA release gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  teeth-qa-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Enforce Teeth QA and access contracts
        env:
          APP_ENV: test
          FLASK_SECRET_KEY: ci-test-secret-key
          SPREADSHEET_ID: ci-test-spreadsheet
          COUNTS_FILE: ${{ runner.temp }}/usage_counts.json
          SUBSCRIBERS_FILE: ${{ runner.temp }}/subscribers.json
          DREAM_PACKS_FILE: ${{ runner.temp }}/dream_packs.json
          QA_GRANTS_FILE: ${{ runner.temp }}/qa_grants.json
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m unittest
          tests.test_teeth_qa_gate
          tests.test_teeth_qa_access
          tests.test_teeth_output_contract
          tests.test_teeth_release_verification
          tests.test_teeth_ctx_001_attempt_binding
          -v
